# Docker Compose for OPF Privacy Filter Web (single container with pf_backend)
# Usage: docker compose up --build
# The app will be available at http://localhost:${WEB_PORT:-8081}
#
# Model is baked into the Docker image (no separate download needed)

services:
  opf-web:
    build: .
    container_name: opf-web
    ports:
      - "${WEB_PORT:-8081}:8080"
    environment:
      - OCR_ENABLED=true
      - HOST_HOME=/host
      - SCAN_HOME=${HOME:-/root}
      - OPF_CONCURRENCY=${OPF_CONCURRENCY:-5}
      - TASK_MAX_AGE_HOURS=${TASK_MAX_AGE_HOURS:-72}
      - TASK_MAX_COUNT=${TASK_MAX_COUNT:-500}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - PF_MODEL_PATH=/models/privacy-filter-multilingual-f16.gguf
      - PF_LIB_PATH=/usr/local/lib/pf/libpf.so
    volumes:
      - ./whitelist:/app/whitelist
      - ./app.py:/app/app.py
      - ./pf_backend.py:/app/pf_backend.py
      - ./frontend/dist:/app/static
      - ${HOME}:/host:ro
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    restart: unless-stopped
